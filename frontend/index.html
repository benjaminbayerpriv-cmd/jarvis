<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Body + both-hands tracking (MediaPipe Tasks HolisticLandmarker).
       Doesn't run here on the main thread — MediaPipe's own docs confirm
       detect()/detectForVideo() are *synchronous, main-thread-blocking*
       calls, so a tracking pass would otherwise freeze the whole page (orb
       included) for however long it takes. It's offloaded to
       frontend/tracking-worker.js instead. See the "camera" section in
       app.js. -->

</head>
<body>
  <main class="stage" id="console">

    <!-- Chat panel: the same #log/#input/composer that already existed
         (previously built but never actually shown to the user) now made
         visible as an actual small chat window, collapsed by default.
         Same collapse mechanic as the camera column: a fixed
         top-left toggle outside the panel itself, plus a .collapsed class
         on the panel that animates its flex-basis to 0 instead of an
         off-screen slide, so Jarvis (next to it) can react to the width
         change instead of the panel just floating over everything. -->
    <button class="icon-btn chat-toggle-btn" id="chatToggleBtn" aria-label="Chatfenster ausklappen" title="Chatfenster ausklappen">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3.5h12v7H6.3L3.3 13.2v-2.7H2z"/>
        <line class="chat-slash" x1="1.5" y1="1.5" x2="14.5" y2="14.5"/>
      </svg>
    </button>
    <aside class="chat-column collapsed" id="debugPanel">
      <header class="deck-head">
        <span class="wordmark">Jarvis</span>
        <span class="state-pill" id="statePill">
          <i class="dot"></i><span id="stateLabel">bereit</span>
        </span>
      </header>

      <p class="hint" id="hint">Mikrofon freigeben, dann hört Jarvis dauerhaft zu.</p>

      <div class="log" id="log"></div>

      <form class="composer" id="composer">
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Schreib oder sprich einfach"
          aria-label="Nachricht an Jarvis"
        />
        <button type="submit" class="send" aria-label="Senden">↵</button>
      </form>
    </aside>

    <div class="jarvis-column">
      <div class="orb-wrap">
        <canvas id="orb" aria-hidden="true"></canvas>
        <canvas id="subOrb" aria-hidden="true" hidden></canvas>
      </div>

      <!-- Icon-only, no labels — this row sits right under the orb, which
           carries all the state a glance needs (colour = mic/speaking state).
           Only one of startBtn/muteBtn is ever visible at a time. quitBtn
           shuts the whole program down (see /shutdown in backend/main.py),
           not just this browser tab. -->
      <div class="control-row">
        <button class="icon-btn" id="startBtn" aria-label="Mikrofon freigeben" title="Mikrofon freigeben">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5.5" y="1.3" width="5" height="8" rx="2.5"/>
            <path d="M3 7.3a5 5 0 0 0 10 0"/>
            <line x1="8" y1="12.3" x2="8" y2="14.3"/>
            <line x1="5" y1="14.3" x2="11" y2="14.3"/>
          </svg>
        </button>
        <button class="icon-btn" id="muteBtn" aria-label="Mikro stumm/aktiv" title="Mikro stumm/aktiv" hidden>
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5.5" y="1.3" width="5" height="8" rx="2.5"/>
            <path d="M3 7.3a5 5 0 0 0 10 0"/>
            <line x1="8" y1="12.3" x2="8" y2="14.3"/>
            <line x1="5" y1="14.3" x2="11" y2="14.3"/>
            <line class="mic-slash" x1="1.5" y1="1.5" x2="14.5" y2="14.5"/>
          </svg>
        </button>
        <button class="icon-btn" id="stopBtn" aria-label="Denkprozess stoppen" title="Denkprozess stoppen">■</button>
        <button class="icon-btn" id="quitBtn" aria-label="Programm beenden" title="Programm beenden">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v5.6"/>
            <path d="M4.4 4.1a5 5 0 1 0 7.2 0"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Webcam + body/hand tracking: raw video is only ever a texture
         source for the canvas (never shown itself), which draws the
         mirrored frame plus the MediaPipe body and both-hands skeleton (no
         face). Only works in a normal
         browser tab — the packaged desktop app's WKWebView on macOS has no
         delegate method for media-capture permission requests at all, so
         getUserMedia() is silently denied there (a real pywebview
         limitation, not fixable from this project's code; a native-Python-
         capture workaround was tried and abandoned — see git history).

         Collapsed by default (see .cam-column.collapsed) — the toggle sits
         fixed to the page's top-right corner rather than inside the column
         itself, so it stays put and clickable whether the column is
         expanded or collapsed to nothing. -->
    <button class="icon-btn cam-toggle-btn" id="camToggleBtn" aria-label="Kamerafenster ausklappen" title="Kamerafenster ausklappen">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 5.3h2.2l1-1.5h5.6l1 1.5H14v8.2H2z"/>
        <circle cx="8" cy="9.4" r="2.3"/>
        <line class="cam-slash" x1="1.5" y1="1.5" x2="14.5" y2="14.5"/>
      </svg>
    </button>
    <div class="cam-column collapsed" id="camColumn">
      <video id="camVideo" autoplay playsinline muted hidden></video>
      <canvas id="camOverlay" aria-hidden="true"></canvas>
      <p class="cam-hint" id="camHint"></p>
    </div>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
