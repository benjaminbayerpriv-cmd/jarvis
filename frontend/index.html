<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="stage" id="console">

    <!-- Chat panel: voice-only (no text input — Jarvis is spoken to, not
         typed at), collapsed by default via a fixed top-left toggle
         outside the panel itself, plus a .collapsed class on the panel
         that animates its flex-basis to 0 instead of an off-screen slide,
         so Jarvis (next to it) can react to the width change instead of
         the panel just floating over everything. -->
    <button class="icon-btn chat-toggle-btn" id="chatToggleBtn" aria-label="Chatfenster ausklappen" title="Chatfenster ausklappen">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3.5h12v7H6.3L3.3 13.2v-2.7H2z"/>
        <line class="chat-slash" x1="1.5" y1="1.5" x2="14.5" y2="14.5"/>
      </svg>
    </button>
    <aside class="chat-column collapsed" id="debugPanel">
      <header class="deck-head">
        <span class="wordmark">Jarvis</span>
        <span class="state-pill" id="statePill">
          <i class="dot"></i><span id="stateLabel">bereit</span>
        </span>
      </header>

      <!-- Sidebar list of past conversations (Claude-style: one short
           auto-generated title per entry, see backend/conversations.py).
           Clicking an entry loads that conversation into #log/history
           below; "Neuer Chat" starts a fresh one. -->
      <div class="conv-sidebar">
        <button type="button" class="conv-new-btn" id="newChatBtn">+ Neuer Chat</button>
        <div class="conv-list" id="convList"></div>
      </div>

      <p class="hint" id="hint">Mikrofon freigeben, dann hört Jarvis dauerhaft zu.</p>

      <div class="log" id="log"></div>
    </aside>

    <div class="jarvis-column">
      <div class="orb-wrap">
        <canvas id="orb" aria-hidden="true"></canvas>
        <canvas id="subOrb" aria-hidden="true" hidden></canvas>
      </div>

      <!-- Icon-only, no labels — this row sits right under the orb, which
           carries all the state a glance needs (colour = mic/speaking state).
           Only one of startBtn/muteBtn is ever visible at a time. -->
      <div class="control-row">
        <button class="icon-btn" id="startBtn" aria-label="Mikrofon freigeben" title="Mikrofon freigeben">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5.5" y="1.3" width="5" height="8" rx="2.5"/>
            <path d="M3 7.3a5 5 0 0 0 10 0"/>
            <line x1="8" y1="12.3" x2="8" y2="14.3"/>
            <line x1="5" y1="14.3" x2="11" y2="14.3"/>
          </svg>
        </button>
        <button class="icon-btn" id="muteBtn" aria-label="Mikro stumm/aktiv" title="Mikro stumm/aktiv" hidden>
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5.5" y="1.3" width="5" height="8" rx="2.5"/>
            <path d="M3 7.3a5 5 0 0 0 10 0"/>
            <line x1="8" y1="12.3" x2="8" y2="14.3"/>
            <line x1="5" y1="14.3" x2="11" y2="14.3"/>
            <line class="mic-slash" x1="1.5" y1="1.5" x2="14.5" y2="14.5"/>
          </svg>
        </button>
        <button class="icon-btn" id="stopBtn" aria-label="Denkprozess stoppen" title="Denkprozess stoppen">■</button>
        <div class="model-picker">
          <button class="icon-btn model-btn" id="modelBtn" aria-label="Modell wechseln" title="Modell wechseln">
            <span class="model-name" id="modelName">Modell</span>
            <svg class="model-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6l4 4 4-4"/>
            </svg>
          </button>
          <div class="model-dropdown collapsed" id="modelDropdown"></div>
        </div>
      </div>
    </div>

    <!-- Fixed to the page's top-right corner (mirrors chatToggleBtn's
         top-left placement) rather than inside .control-row, so it stays
         put and reachable regardless of anything else on screen. -->
    <button class="icon-btn quit-btn" id="quitBtn" aria-label="Programm beenden" title="Programm beenden">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v5.6"/>
        <path d="M4.4 4.1a5 5 0 1 0 7.2 0"/>
      </svg>
    </button>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
