<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="stage" id="console">

    <div class="orb-wrap">
      <canvas id="orb" aria-hidden="true"></canvas>
      <canvas id="subOrb" aria-hidden="true" hidden></canvas>
    </div>

    <!-- Icon-only, no labels — this row sits right under the orb, which
         carries all the state a glance needs (colour = mic/speaking state).
         Only one of startBtn/muteBtn is ever visible at a time. -->
    <div class="control-row">
      <button class="icon-btn" id="startBtn" aria-label="Mikrofon freigeben" title="Mikrofon freigeben">●</button>
      <button class="icon-btn" id="muteBtn" aria-label="Mikro stumm/aktiv" title="Mikro stumm/aktiv" hidden>●</button>
      <!-- Interrupts whatever Jarvis is currently doing (thinking,
           speaking, or an utterance still being recorded) — same action
           as barge-in or the Ctrl/Cmd+Shift+J shortcut, just reachable by
           click. Always visible (not gated to widget mode like quitBtn)
           since it's just as useful in a plain browser tab. -->
      <button class="icon-btn" id="stopBtn" aria-label="Denkprozess unterbrechen" title="Unterbrechen">■</button>
      <!-- Only does anything inside the packaged desktop app (see app.js) —
           a plain browser tab has no window to close, so this stays hidden
           there instead of showing a button that does nothing. -->
      <button class="icon-btn" id="quitBtn" aria-label="Jarvis beenden" title="Beenden" hidden>×</button>
    </div>

    <!-- No visible transcript/chat panel anymore — the orb + the two
         small controls above are the entire UI. The turn-by-turn record
         that used to live in a toggleable sidebar here now goes to
         backend/transcript.log instead (see backend/transcript_log.py) —
         a floating-widget-sized window has no room for a real chat view,
         and this DOM is kept only because #log/#input are still written
         to internally (tool-call/block rendering, text fallback input)
         even with nothing on screen ever revealing them. -->
    <aside class="hidden-chat" id="debugPanel" hidden>
      <header class="deck-head">
        <span class="wordmark">Jarvis</span>
        <span class="state-pill" id="statePill">
          <i class="dot"></i><span id="stateLabel">bereit</span>
        </span>
      </header>

      <p class="hint" id="hint">Mikrofon freigeben, dann hört Jarvis dauerhaft zu.</p>

      <div class="log" id="log"></div>

      <form class="composer" id="composer">
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Schreib oder sprich einfach"
          aria-label="Nachricht an Jarvis"
        />
        <button type="submit" class="send" aria-label="Senden">↵</button>
      </form>
    </aside>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
