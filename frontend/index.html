<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="console" id="console">

    <section class="deck">
      <header class="deck-head">
        <span class="wordmark">Jarvis</span>
        <span class="state-pill" id="statePill">
          <i class="dot"></i><span id="stateLabel">bereit</span>
        </span>
      </header>

      <div class="meter-stage">
        <div class="meter" id="meter">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <g id="ticks"></g>
          </svg>
          <div class="core" id="core"></div>
        </div>
      </div>

      <p class="hint" id="hint">Mikrofon freigeben, dann hört Jarvis dauerhaft zu.</p>

      <div class="log" id="log"></div>

      <form class="composer" id="composer">
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Schreib oder sprich einfach"
          aria-label="Nachricht an Jarvis"
        />
        <button type="submit" class="send" aria-label="Senden">↵</button>
      </form>

      <div class="controls">
        <button class="ctrl" id="startBtn">Mikrofon freigeben</button>
        <button class="ctrl" id="muteBtn" hidden>Mikro aus</button>
      </div>
    </section>

    <section class="bench" id="bench">
      <header class="bench-head">
        <span class="label">Werkbank</span>
        <button class="ctrl ghost" id="clearBench">Leeren</button>
      </header>
      <div class="bench-body" id="benchBody"></div>
    </section>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
