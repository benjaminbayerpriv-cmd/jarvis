<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="stage" id="console">

    <div class="orb-wrap">
      <canvas id="orb" aria-hidden="true"></canvas>
      <canvas id="subOrb" aria-hidden="true" hidden></canvas>
    </div>

    <div class="mic-dock">
      <button class="mic-btn" id="startBtn">Mikrofon freigeben</button>
      <button class="mic-btn" id="muteBtn" hidden>Mikro aus</button>
    </div>

    <button class="debug-toggle" id="debugToggle" aria-label="Debug-Ansicht ein/aus" title="Debug (Cmd/Ctrl+Shift+J)">≡</button>

    <!-- Debug sidebar: full transcript + verbose tool-call log. Hidden by
         default — the orb alone carries state for normal use — toggled via
         the button above or Cmd/Ctrl+Shift+J. -->
    <aside class="hidden-chat" id="debugPanel">
      <header class="deck-head">
        <span class="wordmark">Jarvis</span>
        <span class="state-pill" id="statePill">
          <i class="dot"></i><span id="stateLabel">bereit</span>
        </span>
      </header>

      <p class="hint" id="hint">Mikrofon freigeben, dann hört Jarvis dauerhaft zu.</p>

      <div class="log" id="log"></div>

      <form class="composer" id="composer">
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Schreib oder sprich einfach"
          aria-label="Nachricht an Jarvis"
        />
        <button type="submit" class="send" aria-label="Senden">↵</button>
      </form>
    </aside>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
